# GKE-specific overrides
image:
  repository: "REGION-docker.pkg.dev/PROJECT_ID/cyber-agent-prod/cyber-agent"

serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "cyber-agent@PROJECT_ID.iam.gserviceaccount.com"

ingress:
  enabled: true
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: cyber-agent-ip
    networking.gke.io/managed-certificates: cyber-agent-cert
    networking.gke.io/v1beta1.FrontendConfig: cyber-agent-frontend
  hosts:
    - host: cyber-agent.yourdomain.com
      paths:
        - path: /
          pathType: Prefix

persistence:
  storageClass: standard-rwo
