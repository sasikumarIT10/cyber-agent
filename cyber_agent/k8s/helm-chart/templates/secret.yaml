apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
type: Opaque
data:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- if .Values.secrets.virustotalApiKey }}
  VIRUSTOTAL_API_KEY: {{ .Values.secrets.virustotalApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.abuseipdbApiKey }}
  ABUSEIPDB_API_KEY: {{ .Values.secrets.abuseipdbApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.shodanApiKey }}
  SHODAN_API_KEY: {{ .Values.secrets.shodanApiKey | b64enc | quote }}
  {{- end }}
